<!-- magazine-cover: a real magazine cover set behind the speaker (layer: behind). A photographed blank cover
     (cover.jpg, gloss, spine, a curled corner) cuts in full-bleed under the footage's grain; the masthead eases in
     letter by letter in the display face (the head breaks it), a dateline, coverlines down the sides, all in ink,
     set hard. A real marker circle (circle.png, a photograph of ink) is drawn round the key coverline on its word.
     Paper, ink and type only: no drawn rules, no barcode, no sticker. Words, layout and beat times are constants at
     the top of fx.js. -->
<div class="{{ID}}-paper" data-layout-allow-overlap><img class="{{ID}}-pimg g" src="fx/{{ID}}/cover.jpg" alt="" data-layout-allow-overflow><i class="{{ID}}-grain"></i></div>
<div class="{{ID}}-cv" id="{{ID}}-lt" data-layout-allow-overlap data-layout-allow-occlusion></div>
<img class="{{ID}}-ring" src="fx/{{ID}}/circle.png" alt="" data-layout-allow-overlap data-layout-allow-overflow>
<style>
#{{ID}} .{{ID}}-paper { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
#{{ID}} .{{ID}}-pimg { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; display:block; max-width:none; }
#{{ID}} .{{ID}}-grain { position:absolute; left:0; top:0; width:1080px; height:1920px;
  background:url(fx/{{ID}}/grain.png) 0 0/256px 256px; mix-blend-mode:soft-light; pointer-events:none; }
#{{ID}} .{{ID}}-cv { position:absolute; left:0; top:0; width:1080px; height:1920px; }
#{{ID}} .{{ID}}-dl { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap;
  font-family:var(--font-mono); font-weight:500; font-size:var(--fx-s); line-height:1; letter-spacing:var(--fx-ls-s); color:var(--c-ink); }
#{{ID}} .{{ID}}-dlt { display:inline-block; }
#{{ID}} .{{ID}}-mh { position:absolute; left:0; top:0; width:1080px; text-align:center; white-space:nowrap;
  font-family:var(--font-display); font-style:var(--display-style); font-weight:var(--display-weight);
  font-size:var(--fx-xl); line-height:.8; text-transform:var(--fx-case); color:var(--c-ink); }
#{{ID}} .{{ID}}-mhi { display:inline-block; }
#{{ID}} .{{ID}}-c { display:inline-block; }
#{{ID}} .{{ID}}-bl { display:inline-block; width:0; height:0; }
#{{ID}} .{{ID}}-sky { position:absolute; width:300px; line-height:0; }
#{{ID}} .{{ID}}-sky.{{ID}}-r { text-align:right; }
#{{ID}} .{{ID}}-m { overflow:hidden; }
#{{ID}} .{{ID}}-m.{{ID}}-m0 { margin-bottom:10px; }
#{{ID}} .{{ID}}-m { line-height:1.1; }
#{{ID}} .{{ID}}-k { display:inline-block; font-family:var(--font-mono); font-weight:500; font-size:var(--fx-s); line-height:1.1;
  letter-spacing:var(--fx-ls-s); color:var(--c-ink); white-space:nowrap; }
#{{ID}} .{{ID}}-t { display:inline-block; font-family:var(--font-text); font-weight:var(--text-weight); font-size:var(--fx-s);
  line-height:1.08; letter-spacing:var(--fx-ls-s); text-transform:var(--fx-case); color:var(--c-ink); white-space:nowrap; }
/* the real marker circle round the key coverline: revealed in fx.js (clip-path), never stretched */
#{{ID}} .{{ID}}-ring { position:absolute; left:0; top:0; width:400px; height:auto; max-width:none; clip-path:inset(0 100% 0 0); }
</style>
