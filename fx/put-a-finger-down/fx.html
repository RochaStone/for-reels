<!-- put-a-finger-down: the "put a finger down" count. On each spoken point a real photo or screenshot cuts in at the
     top of the frame (hard-edged, graded and grained like the footage, the previous one gone) and the count ticks
     on a real guest-check pad (pad.jpg, photographed) sitting lower left: the number in the display face and the
     point's word beside it, set hard. Nothing is drawn. Built from POINTS at the top of fx.js; every colour and
     font a token. -->
<div class="pf-wrap">
  <div class="pf-shots"></div>
  <div class="pf-pad"><img class="pf-padimg" src="fx/{{ID}}/pad.jpg" alt=""><i class="pf-grain"></i><div class="pf-rows"></div></div>
</div>
<style>
#{{ID}} .pf-wrap { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
#{{ID}} .pf-shots { position:absolute; left:0; top:0; width:1080px; height:1920px; }
/* the photo: a hard-edged print, square corners, no shadow, the footage's grain over it */
#{{ID}} .pf-shot { position:absolute; overflow:hidden; background:var(--c-ink); }
#{{ID}} .pf-shot img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block; }
#{{ID}} .pf-grain { position:absolute; left:0; top:0; right:0; bottom:0;
  background:url(fx/{{ID}}/grain.png) 0 0/256px 256px; mix-blend-mode:soft-light; pointer-events:none; }
/* the pad: the photographed guest check, lifting off the footage */
#{{ID}} .pf-pad { position:absolute; filter:drop-shadow(0 6px 8px color-mix(in srgb, var(--c-ink) 28%, transparent)); }
#{{ID}} .pf-padimg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; object-fit:cover; object-position:50% 0; }
#{{ID}} .pf-rows { position:absolute; left:0; top:0; width:100%; height:100%; }
/* a row of the count: the number in the display face, the point's word beside it, both set hard in ink */
#{{ID}} .pf-row { position:absolute; left:11%; right:8%; display:flex; align-items:baseline; gap:.22em; white-space:nowrap; color:var(--c-ink); }
#{{ID}} .pf-n { font-family:var(--font-display); font-style:var(--display-style); font-weight:var(--display-weight); font-size:var(--fx-s); line-height:1; letter-spacing:var(--fx-ls-s); }
#{{ID}} .pf-w { font-family:var(--font-text); font-weight:var(--text-weight); font-size:var(--fx-s); line-height:1; letter-spacing:var(--fx-ls-s); text-transform:var(--fx-case); overflow:hidden; text-overflow:clip; }
</style>
