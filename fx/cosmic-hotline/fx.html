<!-- cosmic-hotline, the hook (layer: top): an incoming-call card rings in the top band (a gentle shake, a ring pulsing
     out of ANSWER), ANSWER presses on the cue word, the label flips to "connected" and the card folds down into the
     hook text box.
     Approved deviations from kit/FX_BRIEF.md (signed off by the creator on a still mock-up
     ): this is a signature effect with its own fixed palette (the --hl-* custom properties below,
     the only colours used) instead of the style-pack tokens, and its own fonts (Pinyon Script, Cormorant Garamond
     600 and italic 500, shipped as TTFs in this folder) instead of the pack fonts. The disc's sunburst
     (repeating-conic-gradient) and the card's subtle vertical gradient are approved; no glows or halos.
     Words, cue word and timing are constants at the top of fx.js. -->
<div class="hl">
  <div class="hl-card">
    <div class="hl-top" data-layout-allow-overlap data-layout-allow-occlusion></div>
    <div class="hl-disc"><div class="hl-hub" data-layout-allow-overlap data-layout-allow-occlusion></div></div>
    <div class="hl-title" data-layout-allow-overlap data-layout-allow-occlusion></div>
    <div class="hl-sub" data-layout-allow-overlap data-layout-allow-occlusion></div>
    <div class="hl-btn hl-no">
      <svg viewBox="0 0 88 88"><path d="M33 33 L55 55 M55 33 L33 55"/></svg>
    </div>
    <div class="hl-pulse"></div>
    <div class="hl-btn hl-yes">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    </div>
    <div class="hl-lab hl-lab-no" data-layout-allow-overlap data-layout-allow-occlusion></div>
    <div class="hl-lab hl-lab-yes">
      <span class="hl-l0" data-layout-allow-overlap data-layout-allow-occlusion></span>
      <span class="hl-l1" data-layout-allow-overlap data-layout-allow-occlusion></span>
    </div>
  </div>
</div>
<style>
#{{ID}} {
  --hl-gold:#E8C37A; --hl-gold-hi:#FBE39A; --hl-gold-lo:#8A6A2B; --hl-cream:#FFF6D6;
  --hl-ink:#1B1514; --hl-night:#110D0C; --hl-pink:#F5C6D3;
}
@font-face { font-family:'{{ID}}-pinyon'; src:url('fx/{{ID}}/pinyon-script.ttf') format('truetype'); font-weight:400; font-style:normal; }
@font-face { font-family:'{{ID}}-cormorant'; src:url('fx/{{ID}}/cormorant-600.ttf') format('truetype'); font-weight:600; font-style:normal; }
@font-face { font-family:'{{ID}}-cormorant'; src:url('fx/{{ID}}/cormorant-italic-500.ttf') format('truetype'); font-weight:500; font-style:italic; }

/* the card: 720x500 in the top band, upper centre (the approved still's 900x600 at 0.8) */
#{{ID}} .hl { position:absolute; left:180px; top:230px; width:720px; height:500px; }
#{{ID}} .hl-card { position:absolute; left:0; top:0; width:720px; height:500px; border-radius:46px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--hl-ink) 94%, transparent), color-mix(in srgb, var(--hl-night) 95%, transparent));
  border:2px solid color-mix(in srgb, var(--hl-gold) 55%, transparent); box-sizing:border-box;
  box-shadow:0 24px 56px color-mix(in srgb, var(--hl-night) 42%, transparent),
             inset 0 0 0 8px color-mix(in srgb, var(--hl-gold) 8%, transparent);
  font-feature-settings:'lnum' 1; text-align:center; }
#{{ID}} .hl-top { position:absolute; left:0; top:34px; width:716px; height:24px; line-height:24px; padding-left:.42em;
  box-sizing:border-box; font:600 20px '{{ID}}-cormorant'; letter-spacing:.42em; color:var(--hl-gold); white-space:nowrap; }
/* the rotary disc: gold sunburst, a solid light-gold rim, a ballet-pink hub with a script R */
#{{ID}} .hl-disc { position:absolute; left:302px; top:76px; width:112px; height:112px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, var(--hl-gold) 0 4deg, var(--hl-gold-lo) 4deg 8deg);
  box-shadow:0 0 0 5px var(--hl-gold-hi); }
#{{ID}} .hl-hub { position:absolute; left:28px; top:28px; width:56px; height:56px; border-radius:50%; background:var(--hl-pink);
  box-shadow:inset 0 0 0 3px var(--hl-gold-lo); line-height:60px; font:36px/60px '{{ID}}-pinyon'; color:var(--hl-ink); }
#{{ID}} .hl-title { position:absolute; left:0; top:200px; width:716px; height:100px; line-height:100px; white-space:nowrap;
  font:88px/100px '{{ID}}-pinyon'; color:var(--hl-cream); }
#{{ID}} .hl-sub { position:absolute; left:0; top:298px; width:716px; height:40px; white-space:nowrap;
  font:italic 500 32px/40px '{{ID}}-cormorant'; color:var(--hl-gold-hi); }
/* the buttons: LATER (dark, cross) and ANSWER (gold, phone); the pulse ring sits under ANSWER */
#{{ID}} .hl-btn { position:absolute; top:358px; width:88px; height:88px; border-radius:50%; box-sizing:border-box; }
#{{ID}} .hl-btn svg { position:absolute; left:0; top:0; width:88px; height:88px; }
#{{ID}} .hl-no { left:198px; background:color-mix(in srgb, var(--hl-cream) 12%, var(--hl-ink));
  border:2px solid color-mix(in srgb, var(--hl-gold) 35%, transparent); }
#{{ID}} .hl-no svg { left:-2px; top:-2px; }
#{{ID}} .hl-no path { fill:none; stroke:var(--hl-cream); stroke-width:3.5; stroke-linecap:round; }
#{{ID}} .hl-yes { left:430px; background:var(--hl-gold); box-shadow:inset 0 0 0 2px var(--hl-gold-hi); }
#{{ID}} .hl-yes svg { left:22px; top:22px; width:44px; height:44px; }
#{{ID}} .hl-yes path { fill:var(--hl-ink); }
#{{ID}} .hl-pulse { position:absolute; left:430px; top:358px; width:88px; height:88px; border-radius:50%; box-sizing:border-box;
  border:4px solid var(--hl-gold-hi); }
#{{ID}} .hl-lab { position:absolute; top:452px; width:220px; height:24px; overflow:hidden; white-space:nowrap;
  font:600 19px/24px '{{ID}}-cormorant'; letter-spacing:.2em; padding-left:.2em; box-sizing:border-box; }
#{{ID}} .hl-lab-no { left:132px; color:color-mix(in srgb, var(--hl-cream) 70%, transparent); }
#{{ID}} .hl-lab-yes { left:364px; color:var(--hl-gold-hi); }
#{{ID}} .hl-lab-yes span { position:absolute; left:0; top:0; width:220px; padding-left:.2em; box-sizing:border-box; }
</style>
