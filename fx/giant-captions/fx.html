<!-- giant-captions (over everything): the words take over from the captions. The caption line grows out of the caption
     band into one giant word above the head, a second line rises under it, optional word tiles come up across the
     chest and the last word lands big low in frame. Type set hard: one face (the display face), the creator's light
     ink, no box, no fill, no outline, no coloured shadow; a soft dark shadow only so it reads on footage. Every move
     is an ease and a hold; the stack hard-cuts out just before the window ends. Each row holds its word's centre
     still, so a word fitted smaller stays in place. Give the window a KARAOKE hide so the normal captions step aside.
     Words, keys and times live in fx.js. -->
<div id="{{ID}}-all" data-layout-allow-overlap>
  <div id="{{ID}}-r1" class="{{ID}}-row" data-layout-allow-overlap><div id="{{ID}}-big" class="{{ID}}-b" data-layout-allow-overflow><span class="{{ID}}-t"></span></div></div>
  <div id="{{ID}}-r2" class="{{ID}}-row" data-layout-allow-overlap><div id="{{ID}}-cap" class="{{ID}}-b" data-layout-allow-overflow><span class="{{ID}}-t"></span></div></div>
  <div id="{{ID}}-r3" class="{{ID}}-row" data-layout-allow-overlap><div id="{{ID}}-tiles"></div></div>
  <div id="{{ID}}-r4" class="{{ID}}-row" data-layout-allow-overlap><div id="{{ID}}-sen" class="{{ID}}-b" data-layout-allow-overflow><span class="{{ID}}-t"></span></div></div>
</div>
<style>
#{{ID}}-all { position:absolute; left:0; top:0; width:1080px; height:1920px; }
#{{ID}} .{{ID}}-row { position:absolute; left:0; width:1080px; display:flex; align-items:center; }
#{{ID}}-r1, #{{ID}}-r2, #{{ID}}-r3, #{{ID}}-r4 { top:0; height:0; justify-content:flex-start; }
/* one face, set hard: the display face in the light ink, tight, no fill, no outline; a soft dark shadow so it reads */
#{{ID}} .{{ID}}-b, #{{ID}} .{{ID}}-tile { flex:none; white-space:nowrap; font-family:var(--font-display); font-style:var(--display-style);
  font-weight:var(--display-weight); color:var(--c-light); line-height:1; text-transform:var(--fx-case);
  text-shadow:0 3px 22px color-mix(in srgb, var(--c-dark) 55%, transparent); }
#{{ID}} .{{ID}}-t { display:block; }
/* the giant word */
#{{ID}}-big { font-size:var(--fx-xl); }
/* the line under it */
#{{ID}}-cap { font-size:var(--fx-l); overflow:hidden; }
/* word tiles: a row of small words across the chest */
#{{ID}}-tiles { display:flex; gap:22px; }
#{{ID}} .{{ID}}-tile { font-size:var(--fx-s); }
/* the last word, big and low */
#{{ID}}-sen { font-size:var(--fx-l); }
</style>
