<!-- rotary-dial: a pink and gold rotary dial as a halo behind the speaker's head
     (layer: behind). A gold sunburst dial with a ballet-pink centre; the finger-hole ring dials 1-1-1 on "111", the
     dial rings with two small shakes, then holds and fades out at B. Holes and stop are built by fx.js; words, geometry
     and beat times are constants at the top of fx.js.
     Deviations from FX_BRIEF approved by the creator:
     - a fixed signature palette (--rd-* below, scoped to the effect) instead of style-pack tokens;
     - Cormorant Garamond 600 loaded from this folder instead of the pack's display face;
     - the conic sunburst and the finger stop's metallic linear gradient (the only gradients). No glows. -->
<div id="{{ID}}-d" data-layout-allow-overlap data-layout-allow-occlusion>
  <div id="{{ID}}-base"></div>
  <div id="{{ID}}-sun"></div>
  <div id="{{ID}}-shade"></div>
  <div id="{{ID}}-pink"></div>
  <div id="{{ID}}-ring" data-layout-allow-overlap data-layout-allow-occlusion></div>
  <div id="{{ID}}-stop"></div>
</div>
<style>
@font-face { font-family:'{{ID}}-cg'; font-weight:600; src:url('fx/{{ID}}/cormorant-garamond-600.ttf') format('truetype'); }
#{{ID}} {
  --rd-gold:#E8C37A; --rd-gold-mid:#C99B45; --rd-gold-hi:#FBE39A; --rd-gold-lo:#8A6A2B; --rd-gold-deep:#5A3F14;
  --rd-cream:#FFF6D6; --rd-ink:#1B1514; --rd-pink:#F5C6D3;
}
/* the dial: 940px across, its centre on (CX, CY) from fx.js */
#{{ID}}-d { position:absolute; left:0; top:0; width:940px; height:940px; }
#{{ID}}-d > div { position:absolute; border-radius:50%; }
#{{ID}}-base { left:0; top:0; width:940px; height:940px; background:var(--rd-gold-mid);
  box-shadow:0 0 0 10px var(--rd-gold-hi), 0 0 0 16px var(--rd-gold-lo),
    0 26px 60px color-mix(in srgb, var(--rd-gold-deep) 45%, transparent); }
#{{ID}}-sun { left:0; top:0; width:940px; height:940px;
  background:repeating-conic-gradient(from 0deg, var(--rd-gold) 0 3deg, var(--rd-gold-mid) 3deg 6deg); }
#{{ID}}-shade { left:0; top:0; width:940px; height:940px;
  box-shadow:inset 0 0 120px color-mix(in srgb, var(--rd-gold-deep) 60%, transparent); }
#{{ID}}-pink { left:240px; top:240px; width:460px; height:460px; background:var(--rd-pink);
  box-shadow:inset 0 0 0 6px var(--rd-gold-lo); }
#{{ID}}-ring { left:0; top:0; width:940px; height:940px; border-radius:0; }
#{{ID}} .{{ID}}-h { position:absolute; width:124px; height:124px; border-radius:50%; background:var(--rd-cream);
  box-shadow:inset 0 6px 14px color-mix(in srgb, var(--rd-gold-deep) 55%, transparent), 0 0 0 4px var(--rd-gold-lo); }
#{{ID}} .{{ID}}-lit { position:absolute; left:0; top:0; width:124px; height:124px; border-radius:50%;
  background:var(--rd-gold-hi); box-shadow:inset 0 6px 14px color-mix(in srgb, var(--rd-gold-deep) 55%, transparent); }
#{{ID}} .{{ID}}-n { position:absolute; left:0; top:0; width:124px; height:124px; display:flex; align-items:center;
  justify-content:center; font:600 64px/1 '{{ID}}-cg', serif; font-feature-settings:'lnum' 1; font-variant-numeric:lining-nums;
  color:var(--rd-ink); white-space:nowrap; }
#{{ID}}-stop { width:60px; height:140px; border-radius:30px !important;
  background:linear-gradient(90deg, var(--rd-gold-lo), var(--rd-gold-hi), var(--rd-gold-lo)); }
</style>
