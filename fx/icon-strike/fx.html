<!-- icon-strike: app icons sit above the head on their names, a real marker stroke (strike.png: a photographed
     paint-marker line, kit/material) wipes through each one, on the last word they drop out of frame and one word
     rises where they were, set hard. The icons are built by fx.js from ICONS: flat labelled placeholder tiles, or
     real app icons fetched with icons.py. -->
<div class="is-word"><span data-layout-allow-overlap data-layout-allow-occlusion></span></div>
<div class="is-apps"></div>
<style>
#{{ID}} .is-apps { position:absolute; left:0; top:0; width:1080px; height:1920px; }
#{{ID}} .is-app { position:absolute; width:240px; height:306px; }
/* the icon: a flat square with a soft contact shadow, no rounded tile; a real app icon at 2x when img is set */
#{{ID}} .is-tile { position:absolute; left:0; top:0; width:240px; height:240px; overflow:hidden;
  filter:drop-shadow(0 4px 5px color-mix(in srgb, var(--c-ink) 30%, transparent)); }
#{{ID}} .is-tile img { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
/* the placeholder: a flat square in the pack's light colour, gone once real icons are in */
#{{ID}} .is-ph { background:var(--c-light); }
#{{ID}} .is-ph span { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
  font-family:var(--font-mono); font-weight:500; font-size:var(--fx-s); letter-spacing:var(--fx-ls-s); color:var(--c-muted-light); }
/* the strike: the photographed marker line, revealed left to right */
#{{ID}} .is-strike { position:absolute; left:-40px; top:62px; width:320px; height:auto; display:block; transform-origin:50% 50%; }
/* names and the word: one face, set hard; light over dark footage, ink over bright footage (INK in fx.js) */
#{{ID}} .is-name { position:absolute; left:0; width:240px; top:244px; text-align:center; white-space:nowrap;
  font-family:var(--font-text); font-weight:var(--text-weight); font-size:var(--fx-s); line-height:1.1; letter-spacing:var(--fx-ls-s); text-transform:var(--fx-case); }
#{{ID}} .is-word { position:absolute; left:0; width:1080px; top:290px; height:170px; overflow:hidden; text-align:center; }
#{{ID}} .is-word span { display:inline-block; white-space:nowrap; font-family:var(--font-display); font-style:var(--display-style);
  font-weight:var(--display-weight); font-size:var(--fx-l); line-height:170px; text-transform:var(--fx-case); }
#{{ID}} .is-light .is-name, #{{ID}} .is-light.is-word span { color:var(--c-light); }
#{{ID}} .is-dark .is-name, #{{ID}} .is-dark.is-word span { color:var(--c-ink); }
</style>
