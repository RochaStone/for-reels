<!-- comment-cta: the call to action. A text box holds the CTA from A to the end; under it a comment field types the
     keyword on the speaker's word and posts it, the speaker's reply lands word by word on their words, the comment
     gets a like, then the thread folds up into the text box. Optional: a profile chip rises over the captions and its
     Follow button presses on "follow". Generic flat comment UI in the pack's paper and ink (--c-light / --c-ink), square, hairline, no shadow;
     words, handle and headshot are constants at the top of fx.js. -->
<div class="cc-cta"></div>

<div class="cc-card cc-field">
  <div class="cc-av cc-anon"><svg viewBox="0 0 48 48"><circle class="cc-gl" cx="24" cy="19" r="8"/><path class="cc-gl" d="M8 46 C9.5 34 16 29.5 24 29.5 C32 29.5 38.5 34 40 46 Z"/></svg></div>
  <div class="cc-meta cc-fmeta"><b class="cc-viewer"></b><i>·</i><span class="cc-when"></span></div>
  <div class="cc-ph"></div>
  <div class="cc-txt"><span class="cc-typed"></span><span class="cc-caret"></span></div>
  <div class="cc-send"><i class="cc-on"></i><svg viewBox="0 0 60 60"><path class="cc-arrow" d="M30 42 V19 M20 28 L30 18 L40 28"/></svg></div>
  <div class="cc-heart"><svg viewBox="0 0 48 48">
    <path class="cc-hline" d="M24 40 C10 31 6 24 6 17.5 C6 12 10 8 15 8 C19 8 22 10.5 24 14 C26 10.5 29 8 33 8 C38 8 42 12 42 17.5 C42 24 38 31 24 40 Z"/>
    <path class="cc-hfill" d="M24 40 C10 31 6 24 6 17.5 C6 12 10 8 15 8 C19 8 22 10.5 24 14 C26 10.5 29 8 33 8 C38 8 42 12 42 17.5 C42 24 38 31 24 40 Z"/>
  </svg></div>
</div>

<div class="cc-card cc-reply">
  <div class="cc-av cc-me"></div>
  <div class="cc-meta"><b class="cc-handle"></b><i>·</i><span class="cc-when"></span></div>
  <div class="cc-rtxt"></div>
</div>

<div class="cc-chip">
  <div class="cc-av cc-me cc-chav"></div>
  <div class="cc-who"><div class="cc-chandle"></div><div class="cc-sub"></div></div>
  <div class="cc-btn" data-layout-allow-overlap>
    <div class="cc-bl cc-b1" data-layout-allow-overlap><svg viewBox="0 0 30 30"><path class="cc-chk" d="M6 15.5 L12.5 22 L24.5 9"/></svg><span></span></div>
    <div class="cc-bl cc-b0" data-layout-allow-overlap><span></span></div>
  </div>
</div>
<style>
/* the platform's flat comment UI in the pack's paper (--c-light) and ink (--c-ink): square, no fill colour of its own,
   no shadow. Every size is a step of the type scale (--fx-s); layout() in fx.js places the stack in the clear space. */
#{{ID}} .cc-cta { position:absolute; left:60px; width:960px; top:236px; text-align:center; transform-origin:50% 50%; }
#{{ID}} .cc-ln { display:inline; font-family:var(--font-text); font-weight:800; font-size:var(--fx-s); line-height:1.36; letter-spacing:var(--fx-ls-s);
  text-transform:var(--fx-case); color:var(--c-ink); background:var(--c-light); padding:6px 24px 8px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone; }

/* comment cards: paper, a hairline, ink */
#{{ID}} .cc-card { position:absolute; overflow:hidden; transform-origin:50% 0%; background:var(--c-light); color:var(--c-ink);
  box-shadow:inset 0 0 0 2px var(--c-hair-light); }

#{{ID}} .cc-me .cc-gl { fill:color-mix(in srgb, var(--c-ink) 44%, var(--c-light)); }
#{{ID}} .cc-meta { position:absolute; left:134px; top:12px; white-space:nowrap; font-family:var(--font-text); font-weight:500; font-size:var(--fx-s);
  line-height:1; letter-spacing:var(--fx-ls-s); color:color-mix(in srgb, var(--c-ink) 55%, var(--c-light)); }

  background:color-mix(in srgb, var(--c-ink) 16%, var(--c-light)); }

  line-height:62px; letter-spacing:var(--fx-ls-s); color:var(--c-ink); }
#{{ID}} .cc-sub { position:absolute; left:0; top:84px; white-space:nowrap; font-family:var(--font-text); font-weight:500; font-size:var(--fx-s);
  line-height:56px; letter-spacing:var(--fx-ls-s); color:color-mix(in srgb, var(--c-ink) 55%, var(--c-light)); }
#{{ID}} .cc-btn { position:absolute; right:22px; top:31px; width:330px; height:88px; overflow:hidden; transform-origin:50% 50%;

#{{ID}} .cc-bl { position:absolute; left:0; top:0; width:330px; height:88px; display:flex; align-items:center; justify-content:center; gap:10px;
  white-space:nowrap; font-family:var(--font-text); font-weight:700; font-size:var(--fx-s); line-height:1; letter-spacing:var(--fx-ls-s); }
#{{ID}} .cc-b0 { background:var(--c-ink); color:var(--c-light); }
#{{ID}} .cc-b1 { color:var(--c-ink); }
#{{ID}} .cc-b1 svg { width:34px; height:34px; display:block; }
#{{ID}} .cc-chk { fill:none; stroke:var(--c-ink); stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
</style>
